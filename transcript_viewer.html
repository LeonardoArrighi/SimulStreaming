<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Trascrizione audio di sistema — SimulStreaming</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --text: #e6e8ec;
    --muted: #7d8494;
    --accent: #5fd0a3;
    --accent-dim: #2c4d40;
    --danger: #e0665f;
    --border: #262a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 900px;
    padding: 28px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  h1 span {
    color: var(--muted);
    font-weight: 400;
    font-size: 0.95rem;
    display: block;
    margin-top: 4px;
  }
  #status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 0 0 rgba(224, 102, 95, 0.5);
    transition: background 0.2s ease;
  }
  #dot.live {
    background: var(--accent);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(95, 208, 163, 0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(95, 208, 163, 0); }
    100% { box-shadow: 0 0 0 0 rgba(95, 208, 163, 0); }
  }
  main {
    width: 100%;
    max-width: 900px;
    flex: 1;
    padding: 0 20px 28px;
  }
  #panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 28px;
    min-height: 60vh;
    max-height: 72vh;
    overflow-y: auto;
    font-size: 1.15rem;
    line-height: 1.75;
  }
  #panel p {
    margin: 0 0 0.9em 0;
  }
  #panel .placeholder {
    color: var(--muted);
    font-style: italic;
  }
  #panel .pending {
    color: var(--muted);
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  button:hover {
    color: var(--text);
    border-color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>
    Trascrizione in tempo reale
    <span>Audio di sistema — SimulStreaming</span>
  </h1>
  <div id="status">
    <div id="dot"></div>
    <span id="status-text">Connessione...</span>
  </div>
</header>

<main>
  <div id="panel">
    <p class="placeholder" id="placeholder">In attesa di audio... avvia una riproduzione sul computer.</p>
  </div>
  <div class="toolbar">
    <button id="clear-btn">Svuota</button>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const wsPort = params.get("ws_port") || 8765;
  const wsUrl = `ws://localhost:${wsPort}`;

  const dot = document.getElementById("dot");
  const statusText = document.getElementById("status-text");
  const panel = document.getElementById("panel");
  const placeholder = document.getElementById("placeholder");
  const clearBtn = document.getElementById("clear-btn");

  let currentParagraph = null;

  function setConnected(connected) {
    dot.classList.toggle("live", connected);
    statusText.textContent = connected ? "In ascolto" : "Riconnessione...";
  }

  function ensureParagraph() {
    if (placeholder.parentNode) {
      placeholder.remove();
    }
    if (!currentParagraph) {
      currentParagraph = document.createElement("p");
      panel.appendChild(currentParagraph);
    }
    return currentParagraph;
  }

  function appendText(text) {
    const p = ensureParagraph();
    p.textContent += text;
    panel.scrollTop = panel.scrollHeight;
  }

  function endParagraph() {
    // La fine di un segmento vocale (silenzio rilevato) apre un nuovo paragrafo
    currentParagraph = null;
  }

  function connect() {
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => setConnected(true);
    ws.onclose = () => {
      setConnected(false);
      setTimeout(connect, 1500); // riprova a riconnettersi
    };
    ws.onerror = () => ws.close();

    ws.onmessage = (event) => {
      let data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (data.text) {
        appendText(data.text);
      }
      if (data.is_final) {
        endParagraph();
      }
    };
  }

  clearBtn.addEventListener("click", () => {
    panel.innerHTML = "";
    currentParagraph = null;
    const ph = document.createElement("p");
    ph.className = "placeholder";
    ph.id = "placeholder";
    ph.textContent = "In attesa di audio...";
    panel.appendChild(ph);
  });

  connect();
</script>

</body>
</html>
